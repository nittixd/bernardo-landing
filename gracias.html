<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu consulta · Bernardo Vásquez</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/intertight-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/styles.css?v=1">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<header class="top" data-top>
  <div class="wrap top__in">
    <a class="brand" href="/" aria-label="Bernardo Vásquez, inicio">
      <img class="brand__img" src="/assets/img/avatar.jpg" alt="" width="36" height="36">
      <span class="brand__name">Bernardo Vásquez</span>
    </a>
  </div>
</header>

<main class="done">
  <div class="wrap done__in" data-done>
    <h1 class="done__title" data-title>Tu consulta</h1>
    <p class="done__text" data-text>Si llegaste acá sin pasar por el pago, podés reservar desde el inicio.</p>
    <a class="btn btn--primary btn--inline" href="/#reservar" data-action>Reservar una consulta</a>
    <div class="done__agenda" data-agenda hidden></div>
    <p class="done__small" data-small hidden></p>
  </div>
</main>

<footer class="foot">
  <div class="wrap foot__in">
    <span>© 2026 Bernardo Vásquez</span>
    <span>Abogado · Fideicomisos de administración patrimonial</span>
  </div>
</footer>

<script src="/js/config.js?v=1"></script>
<script src="/js/gracias.js?v=1"></script>
</body>
</html>
